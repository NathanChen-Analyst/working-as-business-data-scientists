<svg xmlns="http://www.w3.org/2000/svg" width="920" height="736" viewBox="0 0 920 736" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/></marker>
  </defs>
  <text x="94" y="22" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8f98">STAGE</text>
  <text x="330" y="22" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8f98">ACTION</text>
  <text x="600" y="22" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8f98">RESULT</text>
  <rect x="40" y="34" width="800" height="220" rx="14" fill="#fff6e8" stroke="#f0b35b" stroke-width="1.5"/>
  <text x="64" y="62" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9a5b00">FRAME</text>
  <text x="128" y="62" font-size="13" fill="#9a5b00">· business judgment</text>
  <rect x="64" y="76" width="752" height="48" rx="8" fill="#ffffff" stroke="#e3b878" stroke-width="1.2"/>
  <text x="84" y="106" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#9a5b00">1</tspan><tspan dx="12">Receive the ask</tspan></text>
  <text x="330" y="97" font-size="12.5" fill="#1f2328">Find out who is asking,</text>
  <text x="330" y="114" font-size="12.5" fill="#1f2328">for which decision, by when</text>
  <text x="588" y="97" font-size="12.5" fill="#1f2328"><tspan fill="#9a5b00">→</tspan><tspan dx="6">Clarifying questions answered</tspan></text>
  <text x="600" y="114" font-size="12.5" fill="#1f2328">Time-box agreed</text>
  <rect x="64" y="134" width="752" height="48" rx="8" fill="#ffffff" stroke="#e3b878" stroke-width="1.2"/>
  <text x="84" y="164" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#9a5b00">2</tspan><tspan dx="12">Frame the question</tspan></text>
  <text x="330" y="155" font-size="12.5" fill="#1f2328">Turn the ask into</text>
  <text x="330" y="172" font-size="12.5" fill="#1f2328">testable hypotheses</text>
  <text x="588" y="155" font-size="12.5" fill="#1f2328"><tspan fill="#9a5b00">→</tspan><tspan dx="6">Issue tree</tspan></text>
  <text x="600" y="172" font-size="12.5" fill="#1f2328">Two-sentence scope agreement</text>
  <rect x="64" y="192" width="752" height="48" rx="8" fill="#ffffff" stroke="#e3b878" stroke-width="1.2"/>
  <text x="84" y="222" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#9a5b00">3</tspan><tspan dx="12">Define metrics &amp; success</tspan></text>
  <text x="330" y="213" font-size="12.5" fill="#1f2328">Agree the primary metric,</text>
  <text x="330" y="230" font-size="12.5" fill="#1f2328">guardrails, and what “done” means</text>
  <text x="588" y="222" font-size="12.5" fill="#1f2328"><tspan fill="#9a5b00">→</tspan><tspan dx="6">One signed-off metric definition</tspan></text>
  <line x1="440" y1="254" x2="440" y2="280" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="282" width="800" height="220" rx="14" fill="#eaf2fc" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="64" y="310" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f4e79">ANALYSE</text>
  <text x="146" y="310" font-size="13" fill="#1f4e79">· technical craft</text>
  <rect x="64" y="324" width="752" height="48" rx="8" fill="#ffffff" stroke="#8fb8e0" stroke-width="1.2"/>
  <text x="84" y="354" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#1f4e79">4</tspan><tspan dx="12">Get &amp; trust the data</tspan></text>
  <text x="330" y="345" font-size="12.5" fill="#1f2328">Query the right tables at the right grain;</text>
  <text x="330" y="362" font-size="12.5" fill="#1f2328">check quality, reconcile</text>
  <text x="588" y="345" font-size="12.5" fill="#1f2328"><tspan fill="#1f4e79">→</tspan><tspan dx="6">Verified queries</tspan></text>
  <text x="600" y="362" font-size="12.5" fill="#1f2328">List of caveats</text>
  <rect x="64" y="382" width="752" height="48" rx="8" fill="#ffffff" stroke="#8fb8e0" stroke-width="1.2"/>
  <text x="84" y="412" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#1f4e79">5</tspan><tspan dx="12">Analyse</tspan></text>
  <text x="330" y="403" font-size="12.5" fill="#1f2328">Run the analysis the question calls for —</text>
  <text x="330" y="420" font-size="12.5" fill="#1f2328">descriptive, diagnostic, experimental, causal</text>
  <text x="588" y="403" font-size="12.5" fill="#1f2328"><tspan fill="#1f4e79">→</tspan><tspan dx="6">Results with uncertainty stated</tspan></text>
  <text x="600" y="420" font-size="12.5" fill="#1f2328">Experiment design, if needed</text>
  <rect x="64" y="440" width="752" height="48" rx="8" fill="#ffffff" stroke="#8fb8e0" stroke-width="1.2"/>
  <text x="84" y="470" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#1f4e79">6</tspan><tspan dx="12">Synthesise into insight</tspan></text>
  <text x="330" y="461" font-size="12.5" fill="#1f2328">Reduce findings to what matters,</text>
  <text x="330" y="478" font-size="12.5" fill="#1f2328">with confidence stated</text>
  <text x="588" y="461" font-size="12.5" fill="#1f2328"><tspan fill="#1f4e79">→</tspan><tspan dx="6">Three claims,</tspan></text>
  <text x="600" y="478" font-size="12.5" fill="#1f2328">sized in business terms</text>
  <line x1="440" y1="502" x2="440" y2="528" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="530" width="800" height="162" rx="14" fill="#eaf7ee" stroke="#5cb876" stroke-width="1.5"/>
  <text x="64" y="558" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1e5631">ACT</text>
  <text x="104" y="558" font-size="13" fill="#1e5631">· persuasion &amp; follow-through</text>
  <rect x="64" y="572" width="752" height="48" rx="8" fill="#ffffff" stroke="#8fcfa0" stroke-width="1.2"/>
  <text x="84" y="602" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#1e5631">7</tspan><tspan dx="12">Recommend &amp; communicate</tspan></text>
  <text x="330" y="593" font-size="12.5" fill="#1f2328">Lead with the recommendation,</text>
  <text x="330" y="610" font-size="12.5" fill="#1f2328">tailored to the audience</text>
  <text x="588" y="593" font-size="12.5" fill="#1f2328"><tspan fill="#1e5631">→</tspan><tspan dx="6">One-page memo</tspan></text>
  <text x="600" y="610" font-size="12.5" fill="#1f2328">or short deck</text>
  <rect x="64" y="630" width="752" height="48" rx="8" fill="#ffffff" stroke="#8fcfa0" stroke-width="1.2"/>
  <text x="84" y="652" font-size="15" font-weight="700" fill="#1f2328"><tspan fill="#1e5631">8</tspan><tspan dx="12">Drive the decision</tspan></text>
  <text x="104" y="669" font-size="15" font-weight="700" fill="#1f2328">&amp; measure the outcome</text>
  <text x="330" y="651" font-size="12.5" fill="#1f2328">Get the decision made and acted on;</text>
  <text x="330" y="668" font-size="12.5" fill="#1f2328">measure whether it worked</text>
  <text x="588" y="651" font-size="12.5" fill="#1f2328"><tspan fill="#1e5631">→</tspan><tspan dx="6">Decision taken; outcome measured</tspan></text>
  <text x="600" y="668" font-size="12.5" fill="#1f2328">Decision log updated</text>
  <path d="M 840 654 H 870 Q 892 654 892 632 V 122 Q 892 100 870 100 H 846" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-loop)"/>
  <g transform="translate(910 377) rotate(-90)"><text x="0" y="0" font-size="12" fill="#57606a" text-anchor="middle">the outcome becomes the next ask</text></g>
  <text x="440" y="722" font-size="12.5" fill="#6e7781" text-anchor="middle">The loop ends in a decision, not a model.</text>
</svg>
